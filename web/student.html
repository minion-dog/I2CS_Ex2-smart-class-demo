<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartClass · סטודנט</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/themes.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <header class="topbar">
        <span class="brand" aria-label="SmartClass">Smart<span class="brand-tag">Class</span></span>
        <span class="who"></span>
        <button class="secondary small theme-btn" id="theme-btn" type="button" aria-label="עיצוב"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8l-.4-.9c-.5-1 .2-2.3 1.4-2.3H17a4 4 0 0 0 4-4c0-4.9-4-9-9-9z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg><span id="theme-name"></span></button>
        <button class="secondary small" id="lang" data-i18n="langSwitch">English</button>
        <button class="secondary small" id="signout" data-i18n="signOut">יציאה</button>
    </header>
    <nav class="tabs" id="tabs" role="tablist">
        <button data-tab="scan" role="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></svg><span data-i18n="tabScan"></span></button>
        <button data-tab="lecture" role="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-i18n="tabLecture"></span></button>
        <button data-tab="assignments" role="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 13l3 3 5-6"/></svg><span data-i18n="tabAssignments"></span></button>
    </nav>
    <main>
        <header class="hero" id="hero" aria-live="polite"><p class="hero-hi" id="hero-hi"></p><h1 class="hero-title" id="hero-title"></h1><p class="hero-sub" id="hero-sub"></p></header>
        <div id="demo-banner" class="banner" hidden data-i18n="demoBanner"></div>

        <!-- ============================ SCAN ============================ -->
        <section id="tab-scan" class="card">
            <h2 data-i18n="scanTitle"></h2>
            <p class="hint" data-i18n="scanHint"></p>
            <div class="scanner" id="scanner" hidden>
                <video id="video" muted playsinline></video>
                <div class="frame" id="frame"></div>
                <div class="finder" id="finder" hidden><i></i><i></i><i></i><i></i></div>
                <div class="scan-guide" id="scan-guide" role="status" aria-live="polite"></div>
                <div class="zoom-buttons">
                    <button type="button" id="zoom-in" aria-label="zoom in">+</button>
                    <span id="zoom-now" dir="ltr">1×</span>
                    <button type="button" id="zoom-out" aria-label="zoom out">−</button>
                </div>
                <figure class="sees">
                    <canvas id="sees" width="120" height="120"></canvas>
                    <figcaption data-i18n="scannerSees"></figcaption>
                </figure>
            </div>
            <p class="center"><button id="scan-stop" class="secondary small" hidden data-i18n="cancel"></button></p>
            <div class="scan-result" id="scan-result" role="status" aria-live="polite"></div>
            <div class="where" id="scan-where" hidden></div>
            <!-- last step: tap your own face in the class photo -->
            <div id="face-step" hidden>
                <h3 id="face-title" data-i18n="pickTitle"></h3>
                <p class="hint" id="face-hint" data-i18n="pickHint"></p>
                <div id="face-pick-view"></div>
                <div id="face-confirm" class="face-confirm" hidden>
                    <div id="face-crop"></div>
                    <div>
                        <p><b data-i18n="isThisYou"></b></p>
                        <p id="face-change-note" class="warn-text" hidden data-i18n="changeWarn"></p>
                        <div class="row">
                            <button id="face-yes" data-i18n="yesMe"></button>
                            <button id="face-no" class="secondary" data-i18n="notMe"></button>
                        </div>
                    </div>
                </div>
                <div id="place-confirm" class="row" hidden>
                    <span class="grow" data-i18n="sendBoxAsk"></span>
                    <button id="place-send" data-i18n="sendBox"></button>
                    <button id="place-cancel" class="secondary" data-i18n="cancel"></button>
                </div>
                <p class="hint" id="place-status" role="status"></p>
                <div class="row">
                    <button id="face-place" class="secondary small" data-i18n="placeBox"></button>
                    <button id="face-none" class="secondary small" data-i18n="cantFind"></button>
                </div>
            </div>
            <div class="scan-result" id="face-msg" role="status" aria-live="polite"></div>
            <p><button id="scan-start" class="big" data-i18n="startCamera"></button></p>
            <p id="demo-practice-row" hidden><button id="demo-practice" class="secondary small" data-i18n="demoPractice"></button></p>
            <ul class="list" id="my-attendance"></ul>
        </section>

        <!-- ============================ LECTURE ============================ -->
        <section id="tab-lecture" hidden>
            <div class="card">
                <label for="session-pick" data-i18n="chooseSession"></label>
                <select id="session-pick"></select>
            </div>
            <div class="grid two" id="lecture-body" hidden>
                <div class="card">
                    <h2 data-i18n="comments"></h2>
                    <div class="feed" id="comment-feed"></div>
                    <input id="comment-text" type="text" data-i18n-placeholder="writeComment">
                    <div class="row">
                        <select id="comment-visibility" class="grow">
                            <option value="public" data-i18n="public"></option>
                            <option value="private" data-i18n="private"></option>
                        </select>
                        <label class="check"><input type="checkbox" id="comment-anon"> <span data-i18n="anonymous"></span></label>
                        <button id="comment-send" data-i18n="send"></button>
                    </div>
                </div>
                <div class="card">
                    <h2 data-i18n="quizTitle"></h2>
                    <p><button id="quiz-reopen" class="big" data-i18n="quizAnswerNow" hidden></button></p>
                    <h2 data-i18n="summary"></h2>
                    <div id="summary-box" class="comment"></div>
                    <details><summary data-i18n="transcript"></summary><div id="transcript-box" class="comment"></div></details>
                </div>
            </div>
        </section>

        <!-- ============================ ASSIGNMENTS ============================ -->
        <section id="tab-assignments" hidden>
            <div id="assignment-list"></div>
        </section>
    </main>
    <script src="vendor/jsQR.js"></script>
    <script type="module" src="js/ui/student.js"></script>
    <div id="quiz-play" class="quiz-stage phone" hidden></div>
</body>
</html>
