// Top-level build file. Versions are pinned so the build is the same on every computer.
// AGP 8.7.3 = the newest version Android Studio Ladybug (2024.2.1) supports.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
