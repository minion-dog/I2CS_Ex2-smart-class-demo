plugins {
    id 'com.android.application'
}

// Firebase reads app/google-services.json (download it from the Firebase console, see README).
// Until that file exists the app still builds: it opens a "not set up yet" screen that sends
// the phone to the website on the local server.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'il.ac.ariel.smartclass'
    compileSdk 35

    defaultConfig {
        applicationId 'il.ac.ariel.smartclass'
        minSdk 26          // java.util.Base64, CameraX and Credential Manager all work from 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Per-app language (Hebrew default, English option) on Android 13+.
    androidResources {
        generateLocaleConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Firebase: sign-in and the shared database (with offline cache).
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // "Sign in with Google" through Android's Credential Manager.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Location for "in class or Zoom".

    // Camera for the QR scanner, ZXing to read and draw QR codes.
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.zxing:core:3.5.3'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
